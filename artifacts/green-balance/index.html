    <script>
      // Stellt einen Pfad wieder her, den 404.html nach einem Reload zwischengespeichert hat.
      (function () {
        try {
          var stored = sessionStorage.getItem("gb:redirect");
          if (stored) {
            sessionStorage.removeItem("gb:redirect");
            history.replaceState(null, "", stored);
          }
        } catch (e) {}
      })();
